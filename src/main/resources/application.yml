server:
  port: 8080

spring:
  profiles:
    active: local
  application:
    name: danganguan-online
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/danganguan_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 1234
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

archive:
  storage-root: storage
  image-enhance:
    provider: ${ARCHIVE_IMAGE_ENHANCE_PROVIDER:noop}
    quark-api:
      endpoint: ${ARCHIVE_QUARK_IMAGE_ENHANCE_ENDPOINT:https://scan-business.quark.cn/vision}
      client-id: ${ARCHIVE_QUARK_IMAGE_ENHANCE_CLIENT_ID:${ARCHIVE_QUARK_IMAGE_ENHANCE_API_KEY_ID:}}
      client-secret: ${ARCHIVE_QUARK_IMAGE_ENHANCE_CLIENT_SECRET:${ARCHIVE_QUARK_IMAGE_ENHANCE_API_KEY:}}
      function-option: ${ARCHIVE_QUARK_IMAGE_ENHANCE_FUNCTION_OPTION:auto_select}
      auto-crop: ${ARCHIVE_QUARK_IMAGE_ENHANCE_AUTO_CROP:true}
      auto-rotate: ${ARCHIVE_QUARK_IMAGE_ENHANCE_AUTO_ROTATE:true}
      need-return-image: ${ARCHIVE_QUARK_IMAGE_ENHANCE_NEED_RETURN_IMAGE:true}
      timeout-seconds: ${ARCHIVE_QUARK_IMAGE_ENHANCE_TIMEOUT_SECONDS:60}
  ai:
    provider: ${ARCHIVE_AI_PROVIDER:local}
    openai-compatible:
      base-url: ${ARCHIVE_AI_BASE_URL:https://api.openai.com/v1/chat/completions}
      api-key: ${ARCHIVE_AI_API_KEY:}
      model: ${ARCHIVE_AI_MODEL:}
      timeout-seconds: ${ARCHIVE_AI_TIMEOUT_SECONDS:60}
  boundary:
    provider: ${ARCHIVE_BOUNDARY_PROVIDER:rule}
    rule-confidence-threshold: ${ARCHIVE_BOUNDARY_RULE_CONFIDENCE_THRESHOLD:0.80}
    openai-compatible:
      base-url: ${ARCHIVE_BOUNDARY_AI_BASE_URL:${ARCHIVE_AI_BASE_URL:https://api.openai.com/v1/chat/completions}}
      api-key: ${ARCHIVE_BOUNDARY_AI_API_KEY:${ARCHIVE_AI_API_KEY:}}
      model: ${ARCHIVE_BOUNDARY_AI_MODEL:${ARCHIVE_AI_MODEL:}}
      timeout-seconds: ${ARCHIVE_BOUNDARY_AI_TIMEOUT_SECONDS:${ARCHIVE_AI_TIMEOUT_SECONDS:60}}
  ocr:
    provider: ${ARCHIVE_OCR_PROVIDER:rapidocr}
    timeout-seconds: ${ARCHIVE_OCR_TIMEOUT_SECONDS:30}
    rapidocr:
      command: ${ARCHIVE_OCR_RAPIDOCR_COMMAND:python}
      script: ${ARCHIVE_OCR_RAPIDOCR_SCRIPT:scripts/ocr/rapidocr_ocr.py}
