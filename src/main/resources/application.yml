server:
  port: 8080

spring:
  application:
    name: danganguan-online
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/danganguan_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 1234
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

archive:
  storage-root: storage
  ai:
    provider: ${ARCHIVE_AI_PROVIDER:local}
    openai-compatible:
      base-url: ${ARCHIVE_AI_BASE_URL:https://api.openai.com/v1/chat/completions}
      api-key: ${ARCHIVE_AI_API_KEY:}
      model: ${ARCHIVE_AI_MODEL:}
      timeout-seconds: ${ARCHIVE_AI_TIMEOUT_SECONDS:60}
  ocr:
    provider: ${ARCHIVE_OCR_PROVIDER:none}
    languages: ${ARCHIVE_OCR_LANGUAGES:chi_sim+eng}
    timeout-seconds: ${ARCHIVE_OCR_TIMEOUT_SECONDS:30}
    tesseract:
      command: ${ARCHIVE_OCR_TESSERACT_COMMAND:tesseract}
      psm: ${ARCHIVE_OCR_TESSERACT_PSM:6}
    python:
      command: ${ARCHIVE_OCR_PYTHON_COMMAND:python}
      script: ${ARCHIVE_OCR_PYTHON_SCRIPT:scripts/ocr/pytesseract_ocr.py}
