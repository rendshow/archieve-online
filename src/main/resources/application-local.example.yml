archive:
  storage:
    # 可选：local / minio
    provider: local
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: danganguan-online
      create-bucket: true
  processing:
    # 可选：sync / rabbitmq
    mode: sync
    rabbitmq:
      exchange: archive.processing.exchange
      queue: archive.processing.task.queue
      routing-key: archive.processing.task
      import-queue: archive.import.finished.queue
      import-routing-key: archive.import.finished
  boundary:
    # 可选：rule / hybrid / ai
    provider: rule
    rule-confidence-threshold: 0.80
    openai-compatible:
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3/chat/completions
      api-key: your-boundary-api-key
      model: your-boundary-model-or-endpoint
      timeout-seconds: 60
  ai:
    provider: openai-compatible
    openai-compatible:
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3/chat/completions
      api-key: your-api-key
      model: your-model-or-endpoint
      timeout-seconds: 60
  ocr:
    # 可选：none / rapidocr
    provider: rapidocr
    timeout-seconds: 60
    rapidocr:
      command: python
      script: scripts/ocr/rapidocr_ocr.py
  image-enhance:
    # 可选：noop / quark-api
    provider: noop
    quark-api:
      endpoint: https://scan-business.quark.cn/vision
      client-id: your-client-id
      client-secret: your-client-secret
      function-option: auto_select
      auto-crop: true
      auto-rotate: true
      need-return-image: true
      timeout-seconds: 60

spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: danganguan
    password: danganguan
