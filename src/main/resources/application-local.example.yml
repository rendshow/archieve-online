archive:
  ai:
    provider: openai-compatible
    openai-compatible:
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3/chat/completions
      api-key: your-api-key
      model: your-model-or-endpoint
      timeout-seconds: 60
  ocr:
    # 可选：none / rapidocr
    provider: rapidocr
    timeout-seconds: 60
    rapidocr:
      command: python
      script: scripts/ocr/rapidocr_ocr.py
